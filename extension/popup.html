<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bizzbot</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark">B</span><div><h1>Bizzbot</h1><p>Listings to CSV</p></div></header>
  <main>
    <h2>Your search. Your spreadsheet.</h2>
    <p>Open a BizBuySell results page, let the listings load, then export this page.</p>
    <button id="export" type="button">Download CSV</button>
    <p id="status" role="status" aria-live="polite">Ready when you are.</p>
    <p class="note">Exports loaded listings on this page only. For another page, navigate there and export again.</p>
  </main>
  <footer>Runs in your browser · No account or server</footer>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
